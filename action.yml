name: Deploy to SproutOS
description: Upload a built application to SproutOS and release it.
author: SproutOS

# A composite action, not JavaScript and not Docker.
#
# JavaScript would mean committing `node_modules` or a bundler step, and shipping a bundle whose
# provenance a customer cannot read. Docker would mean pulling an image on every run, which is
# slower than everything this action actually does. Composite is shell in the open — a customer can
# read exactly what runs in their repository, which matters for an action that holds a token.

branding:
  icon: upload-cloud
  color: green

inputs:
  preset:
    description: >-
      What was built: next, hono, web, android, or static. Decides which files are collected and
      how the platform runs them. `web` is a generic executable bundle and is not an alias for Hono.
    required: true
  directory:
    description: >-
      Where the build output is. Defaults to the preset's conventional location, so most callers do
      not set it.
    required: false
    default: ""
  project:
    description: >-
      The SproutOS project slug. Optional when the repository has exactly one deployable project.

      **Required when the repository holds more than one project** — a monorepo deploying a web app
      and an API separately, or any repository whose projects sit under a group. The platform
      refuses to guess: picking one would deploy the right code onto the wrong service, which looks
      exactly like success.
    required: false
    default: ""
  environment:
    description: production, preview, or development.
    required: false
    default: production
  api-url:
    description: The SproutOS API. Override only for a self-hosted or staging platform.
    required: false
    default: https://api.sproutos.me
  runtime:
    description: >-
      The Lambda runtime to publish on, e.g. `nodejs22.x`. Defaults to the preset's, so most callers
      do not set it. Set it to pin a version rather than follow the platform default.
    required: false
    default: ""
  handler:
    description: The function entry point, e.g. `index.handler`. Defaults to the preset's.
    required: false
    default: ""
  migration-directory:
    description: >-
      A built database migrator. When set, it is uploaded alongside the application and run **before**
      the new version takes traffic — a failed migration fails the deploy and leaves the previous
      release serving.

      Unset means this project has no migration step, which is recorded as `skipped` rather than as
      nothing, so "no migrations" and "somebody forgot" do not look the same.
    required: false
    default: ""
  migration-handler:
    description: The migrator's entry point. Defaults to the application's handler.
    required: false
    default: ""
  static-paths:
    description: >-
      Directories of static assets to publish to the CDN instead of shipping inside the function,
      one per line, as `source` or `source:url-prefix`.

      Most callers leave this unset: each preset has a default that is correct for it. Set it to add
      a directory the preset does not know about, and set it to `none` to publish nothing.

      Plural because a real build has more than one — a Next.js app has hashed chunks under
      `.next/static` and hand-written files under `public/`, which land at different URLs and cannot
      be expressed as a single path.

      Assets published this way are served from a **platform-managed** bucket through the CDN, so
      they do not count against the function's 200 MB archive limit and are not re-downloaded by
      every cold start.

      That bucket is not your project's object-storage service. It is shared across tenants and
      keyed by project — the key prefix is the boundary — and it holds build output only. Files your
      application uploads at runtime belong in the `object_storage` service you provision, which has
      its own credentials and its own lifecycle. Nothing here writes to that.
    required: false
    default: ""
  token:
    description: >-
      A SproutOS deploy token. **Leave this unset.** Without it the action authenticates with GitHub
      OIDC, which issues a short-lived token scoped to this repository and this workflow run — a
      secret that cannot leak because it is never stored. Set it only where OIDC is unavailable.
    required: false
    default: ""
  version-code:
    description: >-
      Android manifest versionCode. Optional when the Gradle output directory contains one
      unambiguous output-metadata.json; required for a direct APK path.
    required: false
    default: ""
  timeout-seconds:
    description: How long to wait for the deployment to become ready, from 1 through 3600 seconds.
    required: false
    default: "1200"

outputs:
  url:
    description: Where the deployment is reachable.
    value: ${{ steps.deploy.outputs.url }}
  deployment-id:
    description: The SproutOS deployment id, for polling or rollback.
    value: ${{ steps.deploy.outputs.deployment-id }}
  digest:
    description: SHA-256 digest of the exact primary artifact SproutOS received.
    value: ${{ steps.deploy.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Resolve the preset
      id: preset
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        DIRECTORY: ${{ inputs.directory }}
        STATIC_PATHS: ${{ inputs.static-paths }}
      run: ${{ github.action_path }}/scripts/resolve-preset.sh

    - name: Authenticate
      id: auth
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        SUPPLIED_TOKEN: ${{ inputs.token }}
        # Provided by GitHub when the workflow requests `id-token: write`. The action cannot request
        # that permission for the caller — a workflow grants its own — so the failure when it is
        # missing has to name the fix, which `authenticate.sh` does.
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        # Preserve omission here. The API selects the only deployable project or refuses an
        # ambiguous repository; substituting the repository name would silently select a same-slug
        # child and bypass that safeguard.
        PROJECT: ${{ inputs.project }}
      run: ${{ github.action_path }}/scripts/authenticate.sh

    - name: Install the pinned SproutOS CLI
      shell: bash
      env:
        # The token is ephemeral and is used only by `gh attestation verify` to read public
        # provenance. It is not a SproutOS/customer credential and is never persisted.
        GH_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/scripts/install-cli.sh

    - name: Package, upload, release, and wait
      id: deploy
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        # Dedicated to deploy. The CLI will not treat it as a general API key.
        SPROUTOS_DEPLOY_TOKEN: ${{ steps.auth.outputs.token }}
        DIRECTORY: ${{ steps.preset.outputs.directory }}
        PRESET: ${{ steps.preset.outputs.preset }}
        # Preserve omission. Repository ambiguity is resolved or refused by the platform.
        PROJECT: ${{ inputs.project }}
        ENVIRONMENT: ${{ inputs.environment }}
        COMMIT: ${{ github.sha }}
        REF: ${{ github.ref_name }}
        # The commit subject, so a deployment list reads like a history rather than a column of
        # shas. Trimmed to one line here because a body would break the JSON payload.
        MESSAGE: ${{ github.event.head_commit.message }}
        RUNTIME: ${{ inputs.runtime }}
        HANDLER: ${{ inputs.handler }}
        MIGRATION_DIRECTORY: ${{ inputs.migration-directory }}
        MIGRATION_HANDLER: ${{ inputs.migration-handler }}
        STATIC_PATHS: ${{ steps.preset.outputs.static-paths }}
        VERSION_CODE: ${{ inputs.version-code }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: ${{ github.action_path }}/scripts/deploy.sh
